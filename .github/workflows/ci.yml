name: Phoenix Test Automation Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule: # Set cron for midnight IST
    - cron: "30 18 * * *"  

  workflow_dispatch:
    inputs:
        env:
         description: "Environment"
         type: choice
         options: [QA, DEV, UAT]
         default: QA
         required: true

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Execute Test Automation Framework
      run: mvn clean test -DsuiteXmlFile=testng.xml -Denv="${{ github.event.inputs.env }}"

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
         name: Surefire Reports
         path: target/surefire-reports/
         retention-days: 10


